# Single-replica Postgres for demo/coherence — IAS §9 does not require a
# production-grade or highly-available database here (TDD §17). Storage is
# an emptyDir (pod-lifetime only, not a PersistentVolumeClaim): acceptable
# for this scope since the seed data is regenerated by the api Deployment's
# idempotent seed step on every restart anyway, and no real cluster
# deployment/persistence is required or graded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            # Non-secret, matches docker-compose's POSTGRES_DB/POSTGRES_USER.
            - name: POSTGRES_DB
              value: "ias_disbursements"
            - name: POSTGRES_USER
              value: "ias_app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ias-api-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ias_app", "-d", "ias_disbursements"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ias_app", "-d", "ias_disbursements"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: postgres-data
          emptyDir: {}
