# EXAMPLE ONLY — placeholder values, never real credentials (TDD §17).
# For an actual deployment: copy this to k8s/secret.yaml (already
# git-ignored, see .gitignore), replace every "replace-with-..." value with
# a real one, and `kubectl apply -f k8s/secret.yaml` — never commit that file.
#
# "postgres" as the DATABASE_URL host is the postgres Service name defined
# in k8s/postgres-service.yaml (Kubernetes' internal DNS resolves it the
# same way "db" resolves inside docker-compose). The user/dbname portions
# (ias_app/ias_disbursements) are pre-filled to match the non-secret
# POSTGRES_USER/POSTGRES_DB values hardcoded in postgres-deployment.yaml —
# only the password is a real secret that needs to vary, and it must match
# POSTGRES_PASSWORD below exactly, since both configure the same database.
apiVersion: v1
kind: Secret
metadata:
  name: ias-api-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://ias_app:replace-with-a-real-password@postgres:5432/ias_disbursements"
  JWT_SECRET: "replace-with-a-real-secret"
  POSTGRES_PASSWORD: "replace-with-a-real-password"
