server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the api service (Docker Compose/k8s service name)
    # — the frontend never needs VITE_API_URL set or CORS headers on the
    # backend, matching how local `vite dev` already behaves via its own
    # dev-server proxy (see apps/web/vite.config.ts).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uses real browser history (createBrowserRouter), so any
    # deep link (e.g. /requests/abc-123) must fall back to index.html and
    # let the client-side router take over, instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
